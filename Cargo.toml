[package]
name = "playwright-ai-test-reviewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Compact, bounded Playwright trace evidence for coding agents"
license = "MIT"
repository = "https://github.com/JustasMonkev/playwrigth-ai-test-reviewer"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "pw-review"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
